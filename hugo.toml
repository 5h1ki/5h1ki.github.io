baseURL = 'https://example.org/'
locale = 'en-us'
title = 'My New Hugo Project'
theme = "reimu"

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'
[languages.zh-CN]
    languageName = '简体中文'
    hasCJKLanguage = true # 开启中日韩文字优化


