baseURL = 'https://5h1ki.github.io/'
defaultContentLanguage = 'zh-CN'
title = 'Shiki的博客'
theme = "reimu"

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]


defaultContentLanguage = 'zh-CN'

[languages.zh-CN]
    locale = 'zh-CN'
    label = '简体中文'
    hasCJKLanguage = true # 开启中日韩文字优化


